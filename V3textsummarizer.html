<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Notes Summarizer</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 80, 200, 0.15);
      width: 520px;
      text-align: center;
    }

    h2 {
      color: #1e5eff;
      margin-bottom: 20px;
    }

    input[type="file"] {
      border: 2px dashed #1e5eff;
      padding: 15px;
      width: 100%;
      border-radius: 10px;
      background: #f0f6ff;
      cursor: pointer;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #1e5eff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: #0047d4;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
    }

    .success { color: green; }
    .loading { color: #1e5eff; }

    /* Toggle Switch */
    .toggle-container {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .switch input { display: none; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0;
      right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #1e5eff;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    /* FULL PAGE SUMMARY SECTION */
    #summarySection {
      margin-top: 30px;
      width: 90%;
      max-width: 900px;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 80, 200, 0.15);
      display: none;
    }

    #summaryTitle {
      color: #1e5eff;
      margin-bottom: 15px;
      font-size: 22px;
      font-weight: bold;
    }

    #output {
      white-space: pre-wrap;
      font-size: 17px;
      line-height: 1.7;
      color: #222;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Upload & Summarize Notes</h2>

    <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt" />

    <div class="toggle-container">
      <span>Local</span>
      <label class="switch">
        <input type="checkbox" id="modeToggle">
        <span class="slider"></span>
      </label>
      <span>Cloud</span>
    </div>

    <button onclick="summarize()">Summarize</button>

    <p id="status"></p>
  </div>

  <!-- FULL PAGE SUMMARY PANEL -->
  <div id="summarySection">
    <div id="summaryTitle">Summary</div>
    <div id="output"></div>
  </div>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <!-- DOCX parser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>

  <script>
    const OPENAI_API_KEY = "YOUR_API_KEY_HERE"; // put your key here

    async function summarize() {
      const file = document.getElementById("fileInput").files[0];
      const status = document.getElementById("status");
      const summarySection = document.getElementById("summarySection");
      const output = document.getElementById("output");
      const cloudMode = document.getElementById("modeToggle").checked;

      summarySection.style.display = "none";
      output.textContent = "";

      if (!file) {
        status.textContent = "Please select a file.";
        status.className = "";
        return;
      }

      status.textContent = "Reading file...";
      status.className = "loading";

      let text = "";

      try {
        if (file.name.toLowerCase().endsWith(".txt")) {
          text = await file.text();
        } else if (file.name.toLowerCase().endsWith(".pdf")) {
          text = await extractPDF(file);
        } else if (file.name.toLowerCase().endsWith(".docx")) {
          text = await extractDOCX(file);
        } else {
          status.textContent = "Unsupported file type.";
          return;
        }
      } catch {
        status.textContent = "Error reading file.";
        return;
      }

      status.textContent = cloudMode ? "Sending to cloud..." : "Processing locally...";
      status.className = "loading";

      let summary;

      try {
        if (cloudMode) {
          summary = await callOpenAI(text);
        } else {
          summary = fakeLocalSummary(text);
        }
      } catch {
        status.textContent = "Error generating summary.";
        return;
      }

      summarySection.style.display = "block";
      output.textContent = summary;

      status.textContent = "Done!";
      status.className = "success";
    }

    async function extractPDF(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

      let text = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(" ") + "\n";
      }
      return text;
    }

    async function extractDOCX(file) {
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer });
      return result.value;
    }

    async function callOpenAI(text) {
      const trimmed = text.slice(0, 12000);

      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + OPENAI_API_KEY
        },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: [
            { role: "system", content: "Summarize the text into clean, readable paragraphs with proper spacing." },
            { role: "user", content: trimmed }
          ]
        })
      });

      const data = await response.json();
      return data.choices?.[0]?.message?.content || "No summary returned.";
    }

    function fakeLocalSummary(text) {
      const sentences = text
        .replace(/\s+/g, " ")
        .split(/(?<=[.!?])\s+/)
        .filter(s => s.trim().length > 0);

      const picked = sentences.slice(0, 6);

      return picked.length
        ? picked.join("\n\n")
        : "Could not generate a summary.";
    }
  </script>

</body>
</html>
