<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUCCEED - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy: #07294D;
            --gold: #FFC600;
            --gray1: #F3F3F3;
            --gray2: #ECECEC;
            --gray3: #BEBEBE;
            --muted: #888;
            --text: #333;
            --danger: #EF4444;
            --ok: #16A34A;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--navy) 0%, #0a3d66 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            color: var(--navy);
        }

        .logo-text span {
            color: var(--gold);
        }

        .logo-sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 5px;
            letter-spacing: 0.05em;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--gray2);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: var(--muted);
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--navy);
            border-bottom-color: var(--gold);
        }

        .tab-btn:hover:not(.active) {
            color: var(--text);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--gray2);
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            color: var(--text);
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(255, 198, 0, 0.1);
        }

        input::placeholder {
            color: var(--gray3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: var(--navy);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn:hover {
            background: #ffd84d;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 198, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            background: rgba(22, 163, 74, 0.1);
            border: 1px solid var(--ok);
            color: var(--ok);
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .success.show {
            display: block;
        }

        .hint {
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">🐉</div>
            <div class="logo-text">Suc<span>ceed</span></div>
            <div class="logo-sub">Your Drexel. Simplified.</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login', event)">Login</button>
            <button class="tab-btn" onclick="switchTab('signup', event)">Sign Up</button>
        </div>

        <!-- LOGIN TAB -->
        <div id="login" class="tab-content active">
            <div id="loginError" class="error"></div>
            <div id="loginSuccess" class="success"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn" id="loginBtn">Login</button>
                <button type="button" class="btn" id="demoBtn" style="background: #9333EA; margin-top: 10px;">Try Demo</button>
            </form>
        </div>

        <!-- SIGNUP TAB -->
        <div id="signup" class="tab-content">
            <div id="signupError" class="error"></div>
            <div id="signupSuccess" class="success"></div>
            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="••••••••" required>
                    <div class="hint">Minimum 6 characters</div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="signupPasswordConfirm" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn" id="signupBtn">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '';  // Use relative URLs for same-domain requests

        function switchTab(tab, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            if (event && event.target) {
                event.target.classList.add('active');
            }
        }

        function showError(tabId, message) {
            const errorEl = document.getElementById(`${tabId}Error`);
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 5000);
        }

        function showSuccess(tabId, message) {
            const successEl = document.getElementById(`${tabId}Success`);
            successEl.textContent = message;
            successEl.classList.add('show');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const response = await fetch(`/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || 'Login failed');
                }

                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('email', data.email);

                showSuccess('login', 'Login successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = 'SUCCEED_Final_Version.html';
                }, 1000);
            } catch (error) {
                showError('login', error.message);
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;
            const btn = document.getElementById('signupBtn');

            if (password !== passwordConfirm) {
                showError('signup', 'Passwords do not match');
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const response = await fetch(`/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || 'Signup failed');
                }

                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('email', data.email);

                showSuccess('signup', 'Account created! Redirecting...');
                setTimeout(() => {
                    window.location.href = 'SUCCEED_Final_Version.html';
                }, 1000);
            } catch (error) {
                showError('signup', error.message);
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        async function handleDemo(e) {
            e.preventDefault();
            const btn = document.getElementById('demoBtn');

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const response = await fetch(`/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'demo@example.com', password: 'demo123' })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || 'Demo login failed');
                }

                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('email', data.email);

                showSuccess('login', 'Demo account loaded! Redirecting...');
                setTimeout(() => {
                    window.location.href = 'SUCCEED_Final_Version.html';
                }, 1000);
            } catch (error) {
                showError('login', error.message);
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // Demo button click handler
        document.getElementById('demoBtn').addEventListener('click', handleDemo);

        // Check if user is already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token');
            if (token) {
                window.location.href = 'SUCCEED_Final_Version.html';
            }
        });
    </script>
</body>
</html>
