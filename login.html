<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: #ffffff;
      padding: 24px;
      width: 320px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #0056b3;
    }

    .signup-link {
      text-align: center;
      margin-top: 12px;
    }

    .signup-link a {
      color: #007bff;
      text-decoration: none;
      font-size: 14px;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .error {
      color: red;
      text-align: center;
      font-size: 14px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Student Login</h2>

    <div id="errorMessage" class="error"></div>

    <form onsubmit="handleLogin(event)">
      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" required />

      <button type="submit">Login</button>
    </form>

    <div class="signup-link">
      Don't have an account? 
      <a href="signup.html">Sign Up</a>
    </div>

  </div>

<script>

async function handleLogin(event) {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errorDiv = document.getElementById("errorMessage");

  errorDiv.textContent = "";

  const storedData = JSON.parse(localStorage.getItem("signupData"));

  if (!storedData) {
    errorDiv.textContent = "No account found. Please sign up first.";
    return;
  }

  const encryptedInputPassword = await encryptPassword(password);

  if (email === storedData.email && encryptedInputPassword === storedData.password) {
    alert("Login Successful ✅");
  } else {
    errorDiv.textContent = "Invalid email or password.";
  }
}

// Same SHA-256 encryption used in signup page
async function encryptPassword(password) {
  const encoder = new TextEncoder();
  const data = encoder.encode(password);
  const hash = await crypto.subtle.digest("SHA-256", data);
  const hashArray = Array.from(new Uint8Array(hash));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

</script>

</body>
</html>
