<!DOCTYPE html>
<!-- saved from url=(0044)https://www.cs.drexel.edu/~pk687/snake3.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>Snake</title>
<style>
  body {
    margin: 0;
    background: #1b1f2a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: "Segoe UI", sans-serif;
    color: white;
  }

  .container {
    text-align: center;
    position: relative;
  }

  h1 {
    color: #ffd43b;
    margin-bottom: 10px;
  }

  canvas {
    background: radial-gradient(#0f172a, #020617);
    border: 6px solid #306998;
    border-radius: 12px;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
  }

  button {
    padding: 12px 30px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  .continue {
    background: #306998;
    color: white;
  }

  .quit {
    background: #ff4444;
    color: white;
  }

  .fuckyou {
    font-size: 64px;
    font-weight: bold;
    color: red;
    animation: flash 0.2s infinite alternate;
  }

  @keyframes flash {
    from { opacity: 1; }
    to { opacity: 0.2; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>🐍 Snake</h1>
  <canvas id="game" width="420" height="420"></canvas>

  <div class="overlay" id="menu" style="display: flex;">
      <h2>Continue?</h2>
      <button class="continue" onclick="startGame()">Continue</button>
      <button class="quit" onclick="quitGame()">Quit</button>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");

const grid = 20;
const tiles = canvas.width / grid;
const icons = ["💻", "📁", "📄", "🖱️", "🗂️"];

let snake, dx, dy, food, loop, running = false;

// INPUT
document.addEventListener("keydown", e => {
  if (!running) return;
  if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -1; }
  if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = 1; }
  if (e.key === "ArrowLeft" && dx === 0) { dx = -1; dy = 0; }
  if (e.key === "ArrowRight" && dx === 0) { dx = 1; dy = 0; }
});

function startGame() {
  menu.style.display = "none";
  snake = [
    {x: 10, y: 10},
    {x: 9, y: 10},
    {x: 8, y: 10}
  ];
  dx = 1; dy = 0;
  food = spawnFood();
  running = true;
  clearInterval(loop);
  loop = setInterval(tick, 120);
}

function quitGame() {
  menu.innerHTML = `<div class="fuckyou">FUCK YOU</div>`;
}

function spawnFood() {
  return {
    x: Math.floor(Math.random() * tiles),
    y: Math.floor(Math.random() * tiles),
    icon: icons[Math.floor(Math.random() * icons.length)]
  };
}

function tick() {
  update();
  draw();
}

function update() {
  const head = { x: snake[0].x + dx, y: snake[0].y + dy };

  if (
    head.x < 0 || head.y < 0 ||
    head.x >= tiles || head.y >= tiles ||
    snake.some(s => s.x === head.x && s.y === head.y)
  ) {
    running = false;
    clearInterval(loop);
    menu.style.display = "flex";
    menu.innerHTML = `
      <h2>Continue?</h2>
      <button class="continue" onclick="startGame()">Continue</button>
      <button class="quit" onclick="quitGame()">Quit</button>
    `;
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    food = spawnFood();
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // FOOD
  ctx.font = "18px Segoe UI Emoji";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(
    food.icon,
    food.x * grid + grid/2,
    food.y * grid + grid/2
  );

  // CURVY BODY
  ctx.lineWidth = grid - 4;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#306998";
  ctx.beginPath();

  snake.forEach((p,i) => {
    const cx = p.x * grid + grid/2;
    const cy = p.y * grid + grid/2;
    if (i === 0) ctx.moveTo(cx, cy);
    else ctx.lineTo(cx, cy);
  });

  ctx.stroke();

  // HEAD
  const head = snake[0];
  const hx = head.x * grid + grid/2;
  const hy = head.y * grid + grid/2;

  ctx.fillStyle = "#ffd43b";
  ctx.beginPath();
  ctx.arc(hx, hy, grid/2.2, 0, Math.PI * 2);
  ctx.fill();

  // EYES
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(hx + dx*4 - dy*4, hy + dy*4 - dx*4, 2, 0, Math.PI*2);
  ctx.arc(hx + dx*4 + dy*4, hy + dy*4 + dx*4, 2, 0, Math.PI*2);
  ctx.fill();
}

// initial draw
draw();
</script>



</body></html>
