<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Notes Summarizer</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 80, 200, 0.15);
      width: 520px;
      text-align: center;
    }

    h2 {
      color: #1e5eff;
      margin-bottom: 20px;
    }

    input[type="file"] {
      border: 2px dashed #1e5eff;
      padding: 15px;
      width: 100%;
      border-radius: 10px;
      background: #f0f6ff;
      cursor: pointer;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #1e5eff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: #0047d4;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
    }

    .success { color: green; }
    .loading { color: #1e5eff; }

    .toggle-container {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .switch input { display: none; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0;
      right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #1e5eff;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    #summarySection {
      margin-top: 30px;
      width: 90%;
      max-width: 900px;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 80, 200, 0.15);
      display: none;
    }

    #summaryTitle {
      color: #1e5eff;
      margin-bottom: 15px;
      font-size: 22px;
      font-weight: bold;
    }

    #output {
      white-space: pre-wrap;
      font-size: 17px;
      line-height: 1.7;
      color: #222;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Upload & Summarize Notes</h2>

    <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt" />

    <div class="toggle-container">
      <span>Local</span>
      <label class="switch">
        <input type="checkbox" id="modeToggle">
        <span class="slider"></span>
      </label>
      <span>Cloud</span>
    </div>

    <button onclick="summarize()">Summarize</button>

    <p id="status"></p>
  </div>

  <div id="summarySection">
    <div id="summaryTitle">Summary</div>
    <div id="output"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>

  <script>
    async function summarize() {
      const file = document.getElementById("fileInput").files[0];
      const status = document.getElementById("status");
      const summarySection = document.getElementById("summarySection");
      const output = document.getElementById("output");
      const cloudMode = document.getElementById("modeToggle").checked;

      summarySection.style.display = "none";
      output.textContent = "";

      if (!file) {
        status.textContent = "Please select a file.";
        status.className = "";
        return;
      }

      status.textContent = "Reading file...";
      status.className = "loading";

      let text = "";

      try {
        if (file.name.endsWith(".txt")) {
          text = await file.text();
        } else if (file.name.endsWith(".pdf")) {
          text = await extractPDF(file);
        } else if (file.name.endsWith(".docx")) {
          text = await extractDOCX(file);
        } else {
          status.textContent = "Unsupported file type.";
          return;
        }
      } catch {
        status.textContent = "Error reading file.";
        return;
      }

      status.textContent = cloudMode ? "Using free cloud model..." : "Processing locally...";
      status.className = "loading";

      let summary;

      try {
        if (cloudMode) {
          summary = await cloudSummary(text);
        } else {
          summary = localTextRankSummary(text);
        }
      } catch (e) {
        status.textContent = "Error generating summary.";
        return;
      }

      summarySection.style.display = "block";
      output.textContent = summary;

      status.textContent = "Done!";
      status.className = "success";
    }

    async function extractPDF(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

      let text = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(" ") + "\n";
      }
      return text;
    }

    async function extractDOCX(file) {
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer });
      return result.value;
    }

    /* ---------------- CLOUD: FREE HUGGINGFACE SUMMARIZER ---------------- */
    async function cloudSummary(text) {
      const trimmed = text.slice(0, 20000);

      const response = await fetch(
        "https://api-inference.huggingface.co/models/facebook/bart-large-cnn",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ inputs: trimmed })
        }
      );

      const data = await response.json();
      return data[0]?.summary_text || "No summary returned.";
    }

    /* ---------------- LOCAL: TEXTRANK SUMMARIZER ---------------- */
    function localTextRankSummary(text) {
      const cleaned = text.replace(/\s+/g, " ").trim();
      const sentences = cleaned.split(/(?<=[.!?])\s+/);

      if (sentences.length < 5) return cleaned;

      const scores = {};
      const words = cleaned.toLowerCase().split(/\W+/);

      const freq = {};
      for (let w of words) {
        if (w.length < 3) continue;
        freq[w] = (freq[w] || 0) + 1;
      }

      const maxFreq = Math.max(...Object.values(freq));

      for (let s of sentences) {
        const sWords = s.toLowerCase().split(/\W+/);
        let score = 0;
        for (let w of sWords) {
          if (freq[w]) score += freq[w] / maxFreq;
        }
        scores[s] = score;
      }

      const ranked = Object.entries(scores)
        .sort((a, b) => b[1] - a[1])
        .slice(0, Math.ceil(sentences.length * 0.25))
        .map(x => x[0]);

      return ranked.join("\n\n");
    }
  </script>

</body>
</html>
