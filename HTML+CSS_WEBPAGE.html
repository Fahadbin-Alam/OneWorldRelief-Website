<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Drexel QoL — Prototype</title>

  <style>
    :root{
      /* First-draft color style */
      --bg: #070A12;
      --panel: rgba(255,255,255,.08);
      --panel2: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --shadow: 0 18px 50px rgba(0,0,0,.55);
      --radius: 18px;

      /* accents from first draft */
      --accent: #FFD200;
      --accent2: #00D1FF;
      --ok: #45FFB1;
      --danger: #FF4D6D;

      --focus: 0 0 0 3px rgba(255,210,0,.22), 0 0 0 1px rgba(255,210,0,.35);

      --hoverLift: translateY(-2px);
      --hoverGlow: 0 16px 46px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.10);
      --hoverBorder: rgba(255,255,255,.20);
      --hoverRing: 0 0 0 1px rgba(255,210,0,.22), 0 0 22px rgba(0,209,255,.10);
    }

    *{ box-sizing: border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      background:
        radial-gradient(900px 500px at 20% 10%, rgba(255,210,0,.18), transparent 60%),
        radial-gradient(700px 420px at 85% 30%, rgba(0,209,255,.16), transparent 62%),
        radial-gradient(900px 540px at 50% 100%, rgba(69,255,177,.08), transparent 60%),
        linear-gradient(180deg, #050711, #050610 55%, #04040A);
      overflow-x: hidden;
    }

    /* ---------- Reusable interactive surface ---------- */
    .surface{
      position: relative;
      border-radius: var(--radius);
      border: 1px solid var(--stroke);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
      will-change: transform;
    }
    .surface::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius: calc(var(--radius) + 2px);
      background: conic-gradient(
        from 180deg,
        rgba(255,210,0,.0),
        rgba(0,209,255,.18),
        rgba(255,210,0,.20),
        rgba(69,255,177,.14),
        rgba(255,210,0,.0)
      );
      opacity: 0;
      filter: blur(12px);
      transition: opacity .18s ease;
      pointer-events:none;
    }
    .surface:hover{
      transform: var(--hoverLift);
      border-color: var(--hoverBorder);
      box-shadow: var(--hoverGlow);
    }
    .surface:hover::before{ opacity: .65; }
    .surface::after{
      content:"";
      position:absolute;
      inset: 0;
      border-radius: var(--radius);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
      pointer-events:none;
    }

    .clickable{ cursor: pointer; }
    .clickable:active{ transform: translateY(0px) scale(.99); }

    /* Ripple */
    .ripple{
      position:absolute;
      border-radius: 999px;
      transform: translate(-50%,-50%);
      pointer-events:none;
      background: radial-gradient(circle, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 60%);
      width: 10px;
      height: 10px;
      opacity: 0;
      animation: ripple .55s ease-out forwards;
    }
    @keyframes ripple{
      0%{ opacity:.95; width: 0; height: 0; }
      100%{ opacity:0; width: 420px; height: 420px; }
    }

    /* ---------- Top bar ---------- */
    .topbar{
      position: sticky;
      top:0;
      z-index: 50;
      display:flex;
      align-items:center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(6,8,16,.55);
      backdrop-filter: blur(10px);
    }
    .brand{ display:flex; align-items:center; gap: 12px; user-select:none; }
    .logo{
      width: 36px; height: 36px; border-radius: 12px;
      background:
        radial-gradient(14px 14px at 30% 30%, rgba(255,255,255,.35), transparent 60%),
        linear-gradient(135deg, rgba(255,210,0,.95), rgba(0,209,255,.85));
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.18);
    }
    .brand h1{ margin:0; font-size: 14px; letter-spacing: .5px; font-weight: 700; }
    .brand p{ margin:0; font-size: 12px; color: var(--muted); }

    .right-actions{ display:flex; align-items:center; gap: 10px; }

    .pill{
      display:inline-flex; align-items:center; gap: 8px;
      padding: 9px 12px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text); font-size: 12px;
      transition: box-shadow .16s ease, border-color .16s ease, transform .16s ease;
    }
    .pill:hover{ border-color: rgba(255,255,255,.20); box-shadow: var(--hoverRing); transform: translateY(-1px); }
    .pill-dot{
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 3px rgba(69,255,177,.12);
    }

    .icon-btn{
      width: 42px; height: 42px; border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      display:inline-grid; place-items:center;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease, box-shadow .16s ease;
      position: relative; overflow: hidden;
    }
    .icon-btn:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.18);
      box-shadow: var(--hoverRing);
    }
    .icon-btn:active{ transform: translateY(0px) scale(.98); }
    .icon-btn:focus{ outline:none; box-shadow: var(--focus); }

    .burger{ width: 18px; height: 12px; position: relative; }
    .burger span{
      position:absolute; left:0;
      width:100%; height: 2px; border-radius: 999px;
      background: rgba(255,255,255,.9);
      transition: transform .18s ease, opacity .18s ease, top .18s ease;
    }
    .burger span:nth-child(1){ top:0; }
    .burger span:nth-child(2){ top:5px; opacity: .9; }
    .burger span:nth-child(3){ top:10px; }
    .menu-open .burger span:nth-child(1){ top:5px; transform: rotate(45deg); }
    .menu-open .burger span:nth-child(2){ opacity: 0; }
    .menu-open .burger span:nth-child(3){ top:5px; transform: rotate(-45deg); }

    /* ---------- Drawer ---------- */
    .drawer-overlay{
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      opacity: 0; pointer-events: none;
      transition: opacity .18s ease;
      z-index: 60;
    }
    .drawer{
      position: fixed; top: 0; right: 0;
      height: 100%; width: min(360px, 92vw);
      background: rgba(10,12,22,.72);
      backdrop-filter: blur(14px);
      border-left: 1px solid rgba(255,255,255,.12);
      box-shadow: var(--shadow);
      transform: translateX(110%);
      transition: transform .22s ease;
      z-index: 70;
      display:flex; flex-direction: column;
    }
    .drawer header{
      padding: 16px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      display:flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .drawer header .title{ display:flex; flex-direction: column; }
    .drawer header .title strong{ font-size: 13px; letter-spacing: .4px; }
    .drawer header .title span{ font-size: 12px; color: var(--muted); }

    .nav{ padding: 10px; display:flex; flex-direction: column; gap: 8px; }
    .nav button{
      position: relative;
      text-align:left;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 12px;
      cursor:pointer;
      display:flex; gap: 10px; align-items: center;
      transition: transform .14s ease, background .14s ease, border-color .14s ease, box-shadow .16s ease;
      overflow: hidden;
    }
    .nav button:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.18);
      box-shadow: var(--hoverRing);
    }
    .nav button:active{ transform: translateY(0px) scale(.99); }
    .nav button:focus{ outline:none; box-shadow: var(--focus); }
    .nav button[aria-current="page"]{
      border-color: rgba(255,210,0,.55);
      background: linear-gradient(135deg, rgba(255,210,0,.18), rgba(0,209,255,.10));
      box-shadow: 0 0 0 1px rgba(255,210,0,.22), 0 0 26px rgba(255,210,0,.08);
    }

    .ico{
      width: 28px; height: 28px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      display:grid; place-items:center;
      flex: 0 0 auto;
      font-size: 14px;
      transition: transform .14s ease, box-shadow .16s ease, border-color .14s ease;
    }
    .nav button:hover .ico{
      transform: translateY(-1px) scale(1.03);
      border-color: rgba(255,255,255,.22);
      box-shadow: 0 0 18px rgba(0,209,255,.10);
    }

    .drawer footer{
      margin-top:auto;
      padding: 14px 14px 16px;
      border-top: 1px solid rgba(255,255,255,.10);
      color: var(--muted);
      font-size: 12px;
      display:flex; justify-content: space-between; gap: 12px; align-items:center;
    }
    .drawer footer a{
      color: rgba(255,255,255,.82);
      text-decoration: none;
      border-bottom: 1px dashed rgba(255,255,255,.25);
    }
    .drawer footer a:hover{ color: rgba(255,255,255,.95); }

    .drawer-open .drawer-overlay{ opacity: 1; pointer-events: auto; }
    .drawer-open .drawer{ transform: translateX(0); }

    /* ---------- Main ---------- */
    .wrap{ min-height: calc(100vh - 70px); }
    main{
      width: min(1100px, 92vw);
      margin: 26px auto 40px;
      display:grid;
      gap: 18px;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 920px){
      .grid{ grid-template-columns: 1.15fr .85fr; align-items: start; }
    }

    .inner{ padding: 18px; }

    .hero{
      padding: 22px;
      background:
        radial-gradient(800px 240px at 20% 10%, rgba(255,210,0,.14), transparent 60%),
        radial-gradient(700px 280px at 85% 35%, rgba(0,209,255,.12), transparent 62%),
        linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border-bottom: 1px solid rgba(255,255,255,.10);
    }
    .hero h2{ margin: 0 0 8px; font-size: 18px; letter-spacing: .2px; }
    .hero p{ margin: 0; color: var(--muted); line-height: 1.45; font-size: 13px; max-width: 62ch; }

    /* Login */
    .form{ display:grid; gap: 12px; padding: 18px; }
    label{ font-size: 12px; color: rgba(255,255,255,.8); display:block; margin-bottom: 6px; }
    .field{ display:flex; flex-direction: column; gap: 6px; }
    input{
      width:100%;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      color: var(--text);
      outline:none;
      transition: box-shadow .12s ease, border-color .12s ease, background .12s ease, transform .12s ease;
    }
    input:hover{ border-color: rgba(255,255,255,.20); }
    input:focus{ box-shadow: var(--focus); border-color: rgba(255,210,0,.42); background: rgba(0,0,0,.22); transform: translateY(-1px); }

    .row{ display:flex; justify-content: space-between; align-items:center; gap: 10px; flex-wrap: wrap; }
    .checkbox{ display:flex; align-items:center; gap: 8px; font-size: 12px; color: var(--muted); user-select:none; }
    .checkbox input{ width: 16px; height: 16px; }

    .btn{
      position: relative;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 14px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease, box-shadow .16s ease;
      font-weight: 600;
      letter-spacing: .2px;
      overflow:hidden;
    }
    .btn:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.18);
      box-shadow: var(--hoverRing);
    }
    .btn:active{ transform: translateY(0px) scale(.99); }
    .btn:focus{ outline:none; box-shadow: var(--focus); }

    .btn-primary{
      border-color: rgba(255,210,0,.45);
      background: linear-gradient(135deg, rgba(255,210,0,.26), rgba(0,209,255,.14));
    }

    .hint{ color: var(--muted); font-size: 12px; line-height: 1.45; }
    .error{
      color: rgba(255,255,255,.92);
      background: rgba(255,77,109,.10);
      border: 1px solid rgba(255,77,109,.28);
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 12px;
      display:none;
    }

    /* Pages */
    .page{ display:none; animation: fadeIn .18s ease; }
    .page.active{ display:block; }
    @keyframes fadeIn{ from{ opacity:.45; transform: translateY(6px);} to{ opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="brand">
    <div class="logo"></div>
    <div>
      <h1>Drexel QoL</h1>
      <p>Prototype</p>
    </div>
  </div>
  <div class="right-actions">
    <span class="pill"><span class="pill-dot"></span> <span id="statusText">Offline</span></span>
    <button class="icon-btn burger" id="burger"><span></span><span></span><span></span></button>
  </div>
</div>

<!-- Drawer -->
<div class="drawer-overlay"></div>
<div class="drawer">
  <header>
    <div class="title">
      <strong id="drawerTitle">Guest</strong>
      <span id="drawerSub">Not logged in</span>
    </div>
    <button class="icon-btn" id="drawerClose">×</button>
  </header>
  <nav class="nav">
    <button aria-current="page"><span class="ico">🏠</span> Home</button>
    <button><span class="ico">📊</span> KPIs</button>
    <button><span class="ico">📝</span> Tasks</button>
    <button><span class="ico">⚙️</span> Settings</button>
  </nav>
  <footer>
    <span>v0.1 Prototype</span>
    <a href="#">Help</a>
  </footer>
</div>

<main class="wrap">

  <!-- Login Page -->
  <div class="surface page active" id="loginCard">
    <h2>Login</h2>
    <form class="form" id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" placeholder="name@drexel.edu" required />
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <input id="loginPass" type="password" placeholder="••••••" required />
      </div>
      <div class="row">
        <button class="btn btn-primary" type="submit">Login</button>
        <button class="btn" type="button" id="demoBtn">Use demo</button>
        <button class="btn" type="button" id="signUpBtn">Sign Up</button>
      </div>
    </form>
    <div class="hint">Don't have an account? Sign up above.</div>
  </div>

  <!-- Sign Up Page -->
  <div class="surface page" id="signUpCard">
    <h2>Sign Up</h2>
    <div class="error" id="signUpError"></div>
    <form class="form" id="signUpForm">
      <div class="field">
        <label for="fullName">Full Name</label>
        <input id="fullName" name="fullName" type="text" placeholder="Jane Doe" required />
      </div>
      <div class="field">
        <label for="signUpEmail">Email</label>
        <input id="signUpEmail" name="signUpEmail" type="email" placeholder="name@drexel.edu" required />
      </div>
      <div class="field">
        <label for="signUpPass">Password</label>
        <input id="signUpPass" name="signUpPass" type="password" placeholder="••••••••" required />
      </div>
      <div class="field">
        <label for="confirmPass">Confirm Password</label>
        <input id="confirmPass" name="confirmPass" type="password" placeholder="••••••••" required />
      </div>
      <div class="row">
        <button class="btn btn-primary" type="submit">Create Account</button>
        <button class="btn" type="button" id="backToLogin">Back to Login</button>
      </div>
    </form>
  </div>

  <!-- App Page -->
  <div class="surface page" id="appCard">
    <h2>Dashboard</h2>
    <p>Welcome to your QoL dashboard.</p>
  </div>

</main>

<script>
  const body = document.body;
  const burger = document.getElementById("burger");
  const drawer = document.querySelector(".drawer");
  const overlay = document.querySelector(".drawer-overlay");
  const drawerClose = document.getElementById("drawerClose");

  burger.addEventListener("click", () => body.classList.toggle("drawer-open"));
  overlay.addEventListener("click", () => body.classList.remove("drawer-open"));
  drawerClose.addEventListener("click", () => body.classList.remove("drawer-open"));

  // Login handling
  const loginForm = document.getElementById("loginForm");
  const demoBtn = document.getElementById("demoBtn");
  const loginCard = document.getElementById("loginCard");
  const appCard = document.getElementById("appCard");
  const statusText = document.getElementById("statusText");
  const drawerSub = document.getElementById("drawerSub");
  const kpiName = document.createElement("span"); // placeholder for name

  loginForm.addEventListener("submit", (e)=>{
    e.preventDefault();
    loginCard.style.display = "none";
    appCard.style.display = "block";
    body.classList.add("authed");
    statusText.textContent = "Active";
    drawerSub.textContent = "Welcome, User";
  });

  demoBtn.addEventListener("click", ()=>{
    loginCard.style.display = "none";
    appCard.style.display = "block";
    body.classList.add("authed");
    statusText.textContent = "Active";
    drawerSub.textContent = "Demo User";
  });

  // Sign Up handling
  const signUpBtn = document.getElementById("signUpBtn");
  const signUpCard = document.getElementById("signUpCard");
  const backToLogin = document.getElementById("backToLogin");
  const signUpForm = document.getElementById("signUpForm");
  const signUpError = document.getElementById("signUpError");

  signUpBtn.addEventListener("click", ()=>{
    loginCard.style.display="none";
    signUpCard.style.display="block";
  });

  backToLogin.addEventListener("click", ()=>{
    signUpCard.style.display="none";
    loginCard.style.display="block";
    signUpError.style.display="none";
  });

  signUpForm.addEventListener("submit",(e)=>{
    e.preventDefault();
    const name = document.getElementById("fullName").value.trim();
    const email = document.getElementById("signUpEmail").value.trim();
    const pass = document.getElementById("signUpPass").value;
    const confirm = document.getElementById("confirmPass").value;

    if(pass !== confirm){
      signUpError.style.display="block";
      signUpError.textContent="Passwords do not match.";
      return;
    }

    console.log("Sign Up:", {name,email,pass});
    signUpError.style.display="none";
    signUpCard.style.display="none";
    appCard.style.display="block";
    body.classList.add("authed");
    statusText.textContent="Active";
    drawerSub.textContent="Welcome, "+name;
  });
</script>

</body>
</html>
