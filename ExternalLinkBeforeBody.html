<!-- ── EXTERNAL LINK WARNING ───────────────── -->
<div class="external-warning-overlay" id="externalWarningOverlay" aria-hidden="true">
  <div class="external-warning-card" role="dialog" aria-modal="true" aria-labelledby="externalWarningTitle">
    <div class="external-warning-head">
      <strong id="externalWarningTitle">Leaving Succeed</strong>
      <p>You are about to open an external website in a new tab.</p>
    </div>
    <div class="external-warning-body">
      <div class="external-warning-url mono" id="externalWarningUrl">—</div>
      <div class="external-warning-note">Choose continue to open it, or cancel to stay inside Succeed.</div>
      <div class="external-warning-actions">
        <button class="btn btn-ghost btn-sm" type="button" id="externalWarningCancel">Cancel</button>
        <button class="btn btn-navy btn-sm" type="button" id="externalWarningConfirm">Continue ↗</button>
      </div>
    </div>
  </div>
</div>
