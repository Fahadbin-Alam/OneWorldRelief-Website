<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THEA - AI Study Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .chat-container {
            width: 400px;
            margin: 50px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: #4a90e2;
            color: white;
            padding: 15px;
            border-radius: 10px 10px 0 0;
            font-size: 18px;
        }

        .chat-box {
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
        }

        .message {
            margin: 10px 0;
        }

        .user {
            text-align: right;
            color: #333;
        }

        .ai {
            text-align: left;
            color: #4a90e2;
        }

        .chat-input {
            display: flex;
            padding: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-left: 10px;
            padding: 10px 15px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #357abd;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        THEA - AI Study Assistant
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message ai">Hi! Ask me anything about your studies 📚</div>
    </div>

    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Type your question...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    function sendMessage() {
        const input = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");

        const userText = input.value.trim();
        if (userText === "") return;

        // Add user message
        const userMsg = document.createElement("div");
        userMsg.className = "message user";
        userMsg.textContent = userText;
        chatBox.appendChild(userMsg);

        // Fake AI response (placeholder)
        const aiMsg = document.createElement("div");
        aiMsg.className = "message ai";

        // Simple response logic (can be replaced with real API later)
        setTimeout(() => {
            aiMsg.textContent = "I'm still learning! But here's something to think about: " + userText;
            chatBox.appendChild(aiMsg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 500);

        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
