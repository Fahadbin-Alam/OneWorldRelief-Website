<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Drexel QoL — Prototype</title>

  <style>
    :root{
      --bg: #070A12;
      --panel: rgba(255,255,255,.08);
      --panel2: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --shadow: 0 18px 50px rgba(0,0,0,.55);
      --radius: 18px;
      --accent: #FFD200;
      --ok: #45FFB1;
      --danger: #FF4D6D;
      --focus: 0 0 0 3px rgba(255,210,0,.22),0 0 0 1px rgba(255,210,0,.35);
    }

    *{box-sizing:border-box;}
    html,body{height:100%; margin:0; font-family:ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial; color:var(--text); background:#070A12; display:flex; flex-direction:column; align-items:center; justify-content:center;}
    
    .surface{
      background: var(--panel);
      border-radius: var(--radius);
      border:1px solid var(--stroke);
      box-shadow: var(--shadow);
      padding: 24px;
      width: 320px;
      display:none;
    }
    .surface.active{display:block;}
    h2{margin:0 0 16px;}
    .form{display:flex; flex-direction:column; gap:12px;}
    .field{display:flex; flex-direction:column;}
    label{font-size:12px; margin-bottom:4px; color:var(--muted);}
    input{padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.18); color:var(--text); outline:none;}
    input:focus{border-color:var(--accent);}
    .row{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
    .btn{padding:10px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:var(--text); cursor:pointer;}
    .btn:hover{background:rgba(255,255,255,.08);}
    .btn-primary{border-color:var(--accent); background:rgba(255,210,0,.2);}
    .hint{font-size:12px; color:var(--muted); margin-top:6px;}
    .error{color:var(--danger); font-size:12px; display:none; margin-top:6px;}

    a{font-size:12px; color:var(--muted); text-decoration:underline; cursor:pointer;}
    .link-row{display:flex; justify-content:space-between; margin-top:-6px;}
  </style>
</head>
<body>

  <!-- Login Card -->
  <div class="surface active" id="loginCard">
    <h2>Login</h2>
    <form id="loginForm" class="form">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required placeholder="name@drexel.edu">
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <input type="password" id="loginPass" required placeholder="••••••">
      </div>
      <div class="link-row">
        <a id="forgotLink">Forgot Password?</a>
        <a id="loginToSignUp">Sign Up</a>
      </div>
      <div class="row">
        <button type="submit" class="btn btn-primary">Login</button>
        <button type="button" id="demoBtn" class="btn">Demo</button>
      </div>
    </form>
    <div class="hint">Use demo to try the prototype without an account.</div>
  </div>

  <!-- Sign Up Card -->
  <div class="surface" id="signUpCard">
    <h2>Sign Up</h2>
    <div class="error" id="signUpError"></div>
    <form id="signUpForm" class="form">
      <div class="field">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required placeholder="Jane Doe">
      </div>
      <div class="field">
        <label for="signUpEmail">Email</label>
        <input type="email" id="signUpEmail" required placeholder="name@drexel.edu">
      </div>
      <div class="field">
        <label for="signUpPass">Password</label>
        <input type="password" id="signUpPass" required placeholder="••••••••">
      </div>
      <div class="field">
        <label for="confirmPass">Confirm Password</label>
        <input type="password" id="confirmPass" required placeholder="••••••••">
      </div>
      <div class="link-row">
        <a id="signUpToLogin">Already have an account? Login</a>
      </div>
      <div class="row">
        <button type="submit" class="btn btn-primary">Create Account</button>
      </div>
    </form>
  </div>

  <!-- Dashboard Card -->
  <div class="surface" id="appCard">
    <h2>Dashboard</h2>
    <p>Welcome! You are now logged in.</p>
  </div>

  <script>
    const loginCard = document.getElementById("loginCard");
    const signUpCard = document.getElementById("signUpCard");
    const appCard = document.getElementById("appCard");

    const loginForm = document.getElementById("loginForm");
    const demoBtn = document.getElementById("demoBtn");
    const signUpForm = document.getElementById("signUpForm");

    const loginToSignUp = document.getElementById("loginToSignUp");
    const signUpToLogin = document.getElementById("signUpToLogin");
    const signUpError = document.getElementById("signUpError");

    // Login submit
    loginForm.addEventListener("submit", e => {
      e.preventDefault();
      loginCard.classList.remove("active");
      appCard.classList.add("active");
    });

    // Demo button
    demoBtn.addEventListener("click", () => {
      loginCard.classList.remove("active");
      appCard.classList.add("active");
    });

    // Switch to Sign Up
    loginToSignUp.addEventListener("click", e => {
      e.preventDefault();
      loginCard.classList.remove("active");
      signUpCard.classList.add("active");
      signUpError.style.display = "none";
    });

    // Switch to Login
    signUpToLogin.addEventListener("click", e => {
      e.preventDefault();
      signUpCard.classList.remove("active");
      loginCard.classList.add("active");
      signUpError.style.display = "none";
    });

    // Sign Up submit
    signUpForm.addEventListener("submit", e => {
      e.preventDefault();
      const pass = document.getElementById("signUpPass").value;
      const confirm = document.getElementById("confirmPass").value;
      if(pass !== confirm){
        signUpError.textContent = "Passwords do not match.";
        signUpError.style.display = "block";
        return;
      }
      signUpError.style.display = "none";
      signUpCard.classList.remove("active");
      appCard.classList.add("active");
    });
  </script>
</body>
</html>
